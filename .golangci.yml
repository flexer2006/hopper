version: "2"

run:
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    decorder:
      disable-dec-order-check: false
    dupl:
      threshold: 120
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    exhaustruct:
      allow-empty-returns: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use zap
        - pattern: ^time\.Sleep$
          msg: delay via broker TTL (FR-10)
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - whyNoLint
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - nilness
        - shadow
    importas:
      no-extra-aliases: true
      alias:
        - pkg: github.com/rabbitmq/amqp091-go
          alias: amqp
    ireturn:
      allow: [error, generic, anon, stdlib, empty]
    lll:
      line-length: 120
    loggercheck:
      kitlog: false
      klog: false
      logr: false
      slog: false
      zap: true
      require-string-key: true
      no-printf-like: true
    musttag:
      functions:
        - name: go.mongodb.org/mongo-driver/v2/bson.Marshal
          tag: bson
          arg-pos: 0
        - name: go.mongodb.org/mongo-driver/v2/bson.Unmarshal
          tag: bson
          arg-pos: 1
    nakedret:
      max-func-lines: 0
    nilnil:
      detect-opposite: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: struct-tag
        - name: superfluous-else
        - name: time-naming
    staticcheck:
      checks: [all]
    tagalign:
      align: false
      sort: true
    tagliatelle:
      case:
        rules:
          json: snake
          bson: snake
          yaml: snake
          env: upperSnake
    testifylint:
      enable-all: true
    usetesting:
      context-background: true
      context-todo: true
    varnamelen:
      min-name-length: 2
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names: [err, ok, id, n, i, j, t, w, r, mu]
    wrapcheck:
      ignore-package-globs:
        - github.com/flexer2006/hopper/*
      extra-ignore-sigs:
        - func (context.Context).Err() error
        - func errors.Join(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - err113
          - exhaustruct
          - forbidigo
          - funlen
          - gochecknoglobals
          - gocognit
          - goconst
          - gocyclo
          - lll
          - maintidx
          - mnd
          - nlreturn
          - noinlineerr
          - varnamelen
          - wrapcheck
          - wsl_v5

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/flexer2006/hopper)
      custom-order: true
    gofumpt:
      extra-rules: true
      module-path: github.com/flexer2006/hopper
    golines:
      max-len: 120
  exclusions:
    generated: lax
